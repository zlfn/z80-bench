# Every C language feature cppstat lists (https://cppstat.dev, CC0-1.0), in
# cppstat's order. A feature a program can show working has a probe in
# <standard>/<name>.c whose probe() returns 1 when it works. One that only a
# compiler's diagnostics show is checked manually, check = "manual":
# <standard>/<name>.c is what each compiler was given, and manual.toml has what
# it did. The rest have check = "none" and say why.

