# What each compiler did with the features features.toml checks manually.
# Each was given <standard>/<name>.c as it is and with each -DCASE=n, cut down
# to that part beforehand so that preprocessors without #elif see it too, and
# with the flags its probes get. The Clang-based compilers also got -pedantic,
# Clang's option for every diagnostic the standard asks for. "ok" means the
# compiler does what the standard says, and "no" that it does not, or that it
# rejects code the check needs.
#
# c99/implicit-return.c is built as a hosted program instead: the Clang-based
# compilers without -ffreestanding, and z88dk's for its CP/M target. Its
# results give their own date, and their own version where it differs from
# the one below.

# The version of each compiler that was checked, and when.
[compilers]
sdcc = { version = "4.6.4 #16998", checked = "2026-10-12" }
"llvm-z80" = { version = "24.0.0git defafaf471b1", checked = "2026-10-12" }
"80cc" = { version = "v26468-4522364999-20261011", checked = "2026-10-12" }
zsdcc = { version = "v26468-4522364999-20261011", checked = "2026-10-12" }
sccz80 = { version = "v26468-4522364999-20261011", checked = "2026-10-12" }
"ez80-clang" = { version = "19.1.0 ef28e9c54cd1, z88dk v26468-4522364999-20261011", checked = "2026-10-12" }
fcc = { version = "7b2a72e", checked = "2026-10-12" }
hitech = { version = "3.09-21", checked = "2026-10-12" }
uc80 = { version = "0.7.0", checked = "2026-10-12" }
dcc = { version = "c98156fe", checked = "2026-10-13" }
"gb-llvm" = { version = "21.0.0git 5bc8de9127f7", checked = "2026-10-12" }

