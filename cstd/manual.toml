"80cc" = { result = "no", note = "main returns what value() left.", checked = "2026-10-14" }
zsdcc = { result = "no", note = "Warning: \"function 'main' must return value\"; main is another name for value().", checked = "2026-10-14" }
sccz80 = { result = "no", note = "main returns what value() left.", checked = "2026-10-14" }
"ez80-clang" = { result = "ok", note = "Sets HL to 0 after the call.", checked = "2026-10-14" }
fcc = { result = "no", note = "main returns what value() left.", checked = "2026-10-14" }
hitech = { result = "no", note = "main jumps to value().", checked = "2026-10-14" }
uc80 = { result = "no", note = "main returns what value() left.", checked = "2026-10-14" }
dcc = { result = "ok", note = "Sets HL to 0 after the call.", checked = "2026-10-14" }
"gb-llvm" = { result = "ok", note = "Sets HL to 0 after the call.", checked = "2026-10-14" }

